# Blueprint de Render. El nombre del servicio es el del repositorio, para no
# chocar con un servicio existente en la cuenta (Render lo actualizaría).
services:
  - type: web
    name: hr-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Publica solo cuando el pipeline de CI pasa
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      # Secretos: se escriben en Render, nunca en el repositorio
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      # Token del gateway autenticado (encabezado cf-aig-authorization)
      - key: CF_AIG_TOKEN
        sync: false
