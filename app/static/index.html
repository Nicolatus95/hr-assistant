<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HR Assistant</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  #answer div { margin: 0.5rem 0; padding: 0.5rem; border-radius: 4px; }
  .user { background: #e8f0fe; }
  .assistant { background: #f1f3f4; }
  .error { background: #fde8e8; }
  small { color: #555; display: block; }
  input { width: 75%; padding: 0.4rem; }
</style>
</head>
<body>
<h1>HR Assistant</h1>
<div data-testid="answer" id="answer"></div>
<div>
  <input data-testid="api-key" id="api-key" type="password" autocomplete="off"
         placeholder="Clave de acceso">
</div>
<form id="form">
  <input data-testid="question" id="question" autocomplete="off"
         placeholder="Pregunta por un empleado o un departamento">
  <button data-testid="send" type="submit">Enviar</button>
</form>
<small>ID de la petición (para soporte):
  <span data-testid="request-id" id="request-id"></span></small>
<script>
  const history = [];
  const log = document.getElementById("answer");
  const input = document.getElementById("question");
  const requestId = document.getElementById("request-id");
  const keyField = document.getElementById("api-key");

  // La clave vive solo en la sesión del navegador y nunca en el código.
  keyField.value = sessionStorage.getItem("hr-api-key") || "";
  keyField.addEventListener("input", () => {
    sessionStorage.setItem("hr-api-key", keyField.value);
  });

  function addLine(kind, text, tools) {
    const box = document.createElement("div");
    box.className = kind;
    box.textContent = text;
    if (tools && tools.length) {
      const note = document.createElement("small");
      note.textContent = "Herramientas usadas: " + tools.join(", ");
      box.appendChild(note);
    }
    log.appendChild(box);
  }

  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) {
      addLine("error", "Escribe una pregunta.");
      return;
    }
    input.value = "";
    addLine("user", question);
    try {
      const reply = await fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": keyField.value,
        },
        body: JSON.stringify({ question: question, history: history }),
      });
      if (reply.status === 401) {
        addLine("error", "Clave inválida");
        return;
      }
      if (reply.status === 429) {
        const wait = reply.headers.get("Retry-After") || "unos";
        addLine("error", "Demasiadas preguntas; espera " + wait + " segundos");
        return;
      }
      if (!reply.ok) {
        addLine("error", "No se pudo obtener la respuesta (error " + reply.status + ").");
        return;
      }
      const data = await reply.json();
      history.push({ role: "user", content: question });
      history.push({ role: "assistant", content: data.answer });
      addLine("assistant", data.answer, data.tools_used);
      requestId.textContent = data.request_id;
    } catch (error) {
      addLine("error", "No se pudo conectar con el servicio.");
    }
  });
</script>
</body>
</html>
